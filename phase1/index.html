  _seed = (_seed * 1664525 + 1013904223) % 4294967296;

}

/* --------------------------------------------------- PURE ECONOMY / LOGIC */
function deriveStats(state) {
  let hustle = 1, swagger = 1, ego = 0;
  SLOTS.forEach((s) => {
    const id = state.equipped[s.id];
    if (!id) return;
    const it = swagOf(id);
    if (!it) return;
    hustle += it.hustle; swagger += it.swagger; ego += it.ego;
  });
  hustle += state.permBonuses.hustle;
  swagger += state.permBonuses.swagger;
  return {
    hustle: Math.max(1, Math.min(10, hustle)),
    swagger: Math.max(1, Math.min(10, swagger)),
    ego: Math.max(0, Math.min(15, ego)),
  };
}
function weeklyUpkeep(state) {
  let u = 0;
  SLOTS.forEach((s) => { const it = swagOf(state.equipped[s.id]); if (it) u += it.upkeep; });
  return u;
}
function weeklyExpenses(state) {
  return (state.rank === "receptionist" ? 0 : DESK_FEE) + weeklyUpkeep(state);
}
function activeModifierDelta(state) {
  return state.activeModifiers.reduce(
    (t, m) => (m.expiresWeek > state.week ? t + m.closeChanceDelta : t), 0);
}
function closeChance(state, lead) {
  const a = arch(lead.archetypeId);
  const st = deriveStats(state);
  let c = 0.35 + st.swagger * 0.05 + a.closeMod + st.ego * a.egoAffinity * 0.01;
  c += activeModifierDelta(state);
  if (lead.referralBonus) c += 0.10;
  return Math.max(0.10, Math.min(0.90, c));
}
function splitFor(rankId) { return rankOf(rankId).split; }
function commissionFor(salePrice, rankId) {
  const gross = Math.round(salePrice * COMMISSION_RATE);
  return { gross, earnings: Math.round(gross * splitFor(rankId)) };
}
function legalArchetypes(rankId) {
  const seller = rankId === "sellerAgent";
  return ARCHETYPES.filter((a) => (a.rankBand === "seller" ? seller : true));
}
function makeName(a) { return pick(FIRST_NAMES) + " " + pick(a.surnames); }
function makeLead(state, forcedArch) {
  const a = forcedArch || pick(legalArchetypes(state.rank));
  const raw = randInt(a.price[0], a.price[1]);
  return {
    id: "L" + Date.now().toString(36) + Math.floor(rand() * 1e6).toString(36),
    archetypeId: a.id,
    clientName: makeName(a),
    stage: "new",
    salePrice: Math.round(raw / 5000) * 5000,
    patience: a.patience,
    maxPatience: a.patience,
    retriedClose: false,
    createdWeek: state.week,
    intro: pick(a.intros),
    referralBonus: false,
  };
}
function nextRank(state) {
  const i = rankIndex(state.rank);
  const nxt = RANKS[i + 1];
  if (!nxt) return null;
  const r = nxt.req;
  const ok = state.careerEarnings >= r.earnings
    && state.counters.showingsRun >= r.showings
    && state.counters.dealsClosed >= r.deals;
  return ok ? nxt : null;
}
function bragFor(state) {
  const t = pick(BRAG_TEMPLATES[state.rank]);
  return t
    .replace("{week}", String(state.week))
    .replace("{cash}", money(state.cash))
    .replace("{earnings}", money(state.careerEarnings))
    .replace("{deals}", String(state.counters.dealsClosed))
    .replace("{showings}", String(state.counters.showingsRun))
    .replace("{leads}", String(state.leads.length));
}

/* ------------------------------------------------------------ INITIAL / IO */
const SAVE_KEY = "res_save_v1";
function initialState() {
  return {
    version: 1, week: 1, cash: START_CASH, careerEarnings: 0, ap: AP_PER_WEEK,
    rank: "receptionist",
    stats: { hustle: 1, swagger: 1, ego: 0 },
    permBonuses: { hustle: 0, swagger: 0 },
    leads: [], ownedSwagIds: [], equipped: {},
    counters: { showingsRun: 0, dealsClosed: 0, leadsLost: 0 },
    activeModifiers: [],
    log: [{ week: 1, kind: "flavor",
      text: "Day one. The broker points at a folding table near the printer and calls it “your desk.” Assist showings and pick up side work until somebody trusts you with a lockbox." }],
    gameOver: false,
    summary: null, promo: null,
  };
}
function loadSave() {
  try {
    const raw = window.localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || s.version !== 1) return null;
    return { ...initialState(), ...s, summary: null, promo: null };
  } catch (e) { return null; }
}
function writeSave(state) {
  try {
    const { summary, promo, ...rest } = state;
    window.localStorage.setItem(SAVE_KEY, JSON.stringify(rest));
  } catch (e) { /* storage unavailable — game continues in memory */ }
}

/* -------------------------------------------------------------- REDUCER */
function logAdd(state, kind, text) {
  return [{ week: state.week, kind, text }, ...state.log].slice(0, 300);
}
function withLog(state, kind, text) { return { ...state, log: logAdd(state, kind, text) }; }
function spendAp(state, n) { return { ...state, ap: state.ap - n }; }
function sync(state) { return { ...state, stats: deriveStats(state) }; }

function reducer(state, action) {
  if (state.gameOver && action.type !== "RESTART" && action.type !== "IMPORT_SAVE") return state;
  switch (action.type) {
    case "WORK_PHONES": {
      if (state.ap < 1) return state;
      const st = deriveStats(state);
      let n = 1 + Math.floor(st.hustle / 3) + (chance(0.5) ? 1 : -1);
      n = Math.max(1, Math.min(4, n));
      let s = spendAp(state, 1);
      const fresh = [];
      for (let i = 0; i < n; i++) fresh.push(makeLead(s));
      s = { ...s, leads: [...s.leads, ...fresh] };
      const names = fresh.map((l) => l.clientName).join(", ");
      return sync(withLog(s, "flavor",
        "You dialed until your ear got hot. Picked up: " + names + "."));
    }
    case "ASSIST_SHOWING": {
      if (state.ap < 1 || state.rank !== "receptionist") return state;
      let s = spendAp(state, 1);
      s = { ...s, cash: s.cash + 100, careerEarnings: s.careerEarnings + 100,
        counters: { ...s.counters, showingsRun: s.counters.showingsRun + 1 } };
      return sync(withLog(s, "money",
        "You " + pick(ASSIST_FLAVORS) + ". The agent handed you " + money(100) + " and called it “exposure, plus money.”"));
    }
    case "SIDE_HUSTLE": {
      if (state.ap < 1) return state;
      const amt = randInt(150, 400);
      let s = spendAp(state, 1);
      s = { ...s, cash: s.cash + amt, careerEarnings: s.careerEarnings + amt };
      return sync(withLog(s, "money",
        "You " + pick(SIDE_HUSTLES) + ". " + money(amt) + ", cash, no questions."));
    }
    case "RUN_SHOWING": {
      if (state.ap < 1 || state.rank === "receptionist") return state;
      const lead = state.leads.find((l) => l.id === action.leadId);
      if (!lead || lead.stage === "ready") return state;
      const a = arch(lead.archetypeId);
      const advanced = lead.stage === "new" ? "shown" : "ready";
      let s = spendAp(state, 1);
      s = { ...s, leads: s.leads.map((l) => (l.id === lead.id ? { ...l, stage: advanced } : l)),
        counters: { ...s.counters, showingsRun: s.counters.showingsRun + 1 } };
      let text = "You walked " + lead.clientName + " through a " + a.label.toLowerCase()
        + "'s idea of a dream home. "
        + (advanced === "ready"
          ? "They stopped asking questions and started asking about the paperwork."
          : "They didn't leave immediately. In this business that's a milestone.");
      if (state.rank === "junior") {
        s = { ...s, cash: s.cash + 150, careerEarnings: s.careerEarnings + 150 };
        text += " The office paid you " + money(150) + " for your trouble.";
      }
      return sync(withLog(s, state.rank === "junior" ? "money" : "flavor", text));
    }
    case "ATTEMPT_CLOSE": {
      if (state.ap < 1 || state.rank === "receptionist") return state;
      const lead = state.leads.find((l) => l.id === action.leadId);
      if (!lead || lead.stage !== "ready" || lead.sold) return state;
      const a = arch(lead.archetypeId);
      let s = spendAp(state, 1);
      const success = chance(closeChance(state, lead));
      if (!success) {
        if (lead.retriedClose) {
          s = { ...s, leads: s.leads.filter((l) => l.id !== lead.id),
            counters: { ...s.counters, leadsLost: s.counters.leadsLost + 1 } };
          return sync(withLog(s, "event",
            lead.clientName + " walked for good. Second time at the table, second time watching a pen go back in a pocket."));
        }
        s = { ...s, leads: s.leads.map((l) => (l.id === lead.id
          ? { ...l, patience: Math.max(0, l.patience - 1), retriedClose: true } : l)) };
        return sync(withLog(s, "event",
          lead.clientName + " needed to “sleep on it,” which is a thing people say while backing toward a door. One more shot at this."));
      }
      const isReferralCut = state.rank === "junior";
      const { gross, earnings } = commissionFor(lead.salePrice, state.rank);
      s = { ...s,
        cash: s.cash + earnings, careerEarnings: s.careerEarnings + earnings,
        leads: s.leads.map((l) => (l.id === lead.id ? { ...l, sold: true } : l)),
        counters: { ...s.counters, dealsClosed: s.counters.dealsClosed + 1 } };
      const line = lead.clientName + " " + pick(a.successes)
        + " The house sold for " + money(lead.salePrice) + "; "
        + (isReferralCut
          ? "the agent who signed it slid you a referral cut of " + money(earnings) + " and a compliment about your handwriting."
          : "your share came to " + money(earnings) + ".");
      return sync(withLog(s, "deal", line));
    }
    case "BUY_SWAG": {
      const it = swagOf(action.itemId);
      if (!it || state.ownedSwagIds.includes(it.id)) return state;
      if (rankIndex(state.rank) < rankIndex(it.unlockRank)) return state;
      if (state.cash < it.price) return state;
      let s = { ...state, cash: state.cash - it.price, ownedSwagIds: [...state.ownedSwagIds, it.id] };
      s = { ...s, equipped: { ...s.equipped, [it.slot]: it.id } };
      return sync(withLog(s, "money",
        "You bought the " + it.name + " and wore it out of the store. " + it.flavor));
    }
    case "EQUIP_SWAG": {
      const it = swagOf(action.itemId);
      if (!it || !state.ownedSwagIds.includes(it.id)) return state;
      const already = state.equipped[it.slot] === it.id;
      const equipped = { ...state.equipped };
      if (already) delete equipped[it.slot]; else equipped[it.slot] = it.id;
      const s = { ...state, equipped };
      return sync(withLog(s, "flavor", already
        ? "You put the " + it.name + " away. The room felt quieter."
        : "You put on the " + it.name + " and checked your reflection in a parked car."));
    }
    case "END_WEEK": return endWeek(state);
    case "IMPORT_SAVE": return sync({ ...initialState(), ...action.state, summary: null, promo: null });
    case "RESTART": return initialState();
    default: return state;
  }
}

/* --------------------------------------------------------------- END WEEK */
function endWeek(state) {
  let s = { ...state };
  const money_in = [], money_out = [], events = [];
  const startCash = s.cash;

  if (s.ap > 0) s = withLog(s, "flavor", "You spent the rest of the week practicing your signature.");

  /* 0. archive anything that closed this week (the SOLD stamp has had its moment) */
  s = { ...s, leads: s.leads.filter((l) => !l.sold) };

  /* 1. patience + ghost rolls */
  const survivors = [];
  s.leads.forEach((l) => {
    const a = arch(l.archetypeId);
    if (a.ghostChance > 0 && chance(a.ghostChance)) {
      s = withLog(s, "event", l.clientName + " " + pick(a.ghosts));
      s = { ...s, counters: { ...s.counters, leadsLost: s.counters.leadsLost + 1 } };
      return;
    }
    const p = l.patience - 1;
    if (p <= 0) {
      s = withLog(s, "event", l.clientName + " ran out of runway and " + pick(a.ghosts));
      s = { ...s, counters: { ...s.counters, leadsLost: s.counters.leadsLost + 1 } };
      return;
    }
    survivors.push({ ...l, patience: p });
  });
  s = { ...s, leads: survivors };

  /* 2. expenses */
  const desk = s.rank === "receptionist" ? 0 : DESK_FEE;
  const upkeep = weeklyUpkeep(s);
  if (desk) { s = { ...s, cash: s.cash - desk }; money_out.push(["Desk fee", desk]);
    s = withLog(s, "money", "The brokerage took its desk fee, as brokerages do, for the desk you barely sit at."); }
  if (upkeep) { s = { ...s, cash: s.cash - upkeep }; money_out.push(["Swag upkeep", upkeep]);
    s = withLog(s, "money", "Insurance, storage, and dry cleaning on the image. Looking like this isn't free."); }

  /* 3. random event (30%) */
  if (chance(0.30)) {
    const pool = EVENTS.filter((e) => e.condition(s));
    const total = pool.reduce((t, e) => t + e.weight, 0);
    if (total > 0) {
      let roll = rand() * total, chosen = pool[0];
      for (const e of pool) { roll -= e.weight; if (roll <= 0) { chosen = e; break; } }
      const r = applyEvent(s, chosen.id);
      s = r.state; events.push(r.label);
      if (r.cashDelta > 0) money_in.push([r.label, r.cashDelta]);
      if (r.cashDelta < 0) money_out.push([r.label, -r.cashDelta]);
    }
  }

  /* 4. cringe event (independent, ego >= 8) */
  if (deriveStats(s).ego >= 8 && chance(0.20)) {
    const r = applyEvent(s, "cringeEvent");
    s = r.state; events.push(r.label); money_out.push([r.label, -r.cashDelta]);
  }

  /* 5. promotion */
  let promo = null;
  const nxt = nextRank(s);
  if (nxt) {
    s = { ...s, rank: nxt.id };
    promo = nxt;
    s = withLog(s, "promotion",
      "PROMOTED: " + nxt.name + ". They printed a certificate. Someone spelled your name right on the second try.");
  }

  /* 6. tidy modifiers, roll the week */
  s = { ...s,
    activeModifiers: s.activeModifiers.filter((m) => m.expiresWeek > s.week),
    week: s.week + 1, ap: AP_PER_WEEK };
  s = sync(s);

  /* 7. lose check */
  if (s.cash < LOSE_AT) {
    s = withLog(s, "event",
      "Your card declined at the printer. Then at the gas station. Then, memorably, at the open house you were catering.");
    s = { ...s, gameOver: true };
  }

  const summary = {
    week: state.week, moneyIn: money_in, moneyOut: money_out, events,
    net: s.cash - startCash, promo: promo ? promo.name : null, brag: bragFor(s),
  };
  return { ...s, summary, promo: promo ? promo.name : null };
}

function applyEvent(state, id) {
  let s = state, cashDelta = 0, label = "";
  const activeLeads = s.leads;
  switch (id) {
    case "ghosted": {
      const l = pick(activeLeads); const a = arch(l.archetypeId);
      s = { ...s, leads: s.leads.filter((x) => x.id !== l.id),
        counters: { ...s.counters, leadsLost: s.counters.leadsLost + 1 } };
      s = withLog(s, "event", l.clientName + " " + pick(a.ghosts));
      label = "Client vanished"; break;
    }
    case "lockbox": {
      const l = pick(activeLeads.filter((x) => x.stage === "shown"));
      s = { ...s, cash: s.cash - 50,
        leads: s.leads.map((x) => (x.id === l.id ? { ...x, patience: Math.max(0, x.patience - 1) } : x)) };
      cashDelta = -50;
      s = withLog(s, "event", "The lockbox ate the key with " + l.clientName
        + " standing in the rain behind you. A locksmith arrived, judged you, and charged you.");
      label = "Locksmith"; break;
    }
    case "poached": {
      const l = pick(activeLeads.filter((x) => x.stage === "ready"));
      s = { ...s, leads: s.leads.filter((x) => x.id !== l.id),
        counters: { ...s.counters, leadsLost: s.counters.leadsLost + 1 } };
      s = withLog(s, "event", "Chadwick Sterling III took " + l.clientName
        + " to lunch, said the words “boutique white-glove experience,” and walked out with your deal. His teeth are fake. Everyone knows.");
      label = "Poached by Chadwick"; break;
    }
    case "referral": {
      const lead = { ...makeLead(s), referralBonus: true };
      s = { ...s, leads: [...s.leads, lead] };
      s = withLog(s, "event", "A past client told " + lead.clientName
        + " you were “actually normal,” which in this industry is a rave review. They arrived pre-sold.");
      label = "Referral"; break;
    }
    case "hotMarket": {
      s = { ...s, activeModifiers: [...s.activeModifiers, { closeChanceDelta: 0.10, expiresWeek: s.week + 2 }] };
      s = withLog(s, "event", "The market went feral. Buyers are waiving inspections and apologizing to sellers for existing.");
      label = "Hot market"; break;
    }
    case "rateSpike": {
      s = { ...s, activeModifiers: [...s.activeModifiers, { closeChanceDelta: -0.10, expiresWeek: s.week + 2 }] };
      s = withLog(s, "event", "Rates jumped. Every buyer in town suddenly wants to “watch it for a bit.”");
      label = "Rate spike"; break;
    }
    case "lostPaperwork": {
      s = { ...s, cash: s.cash - 100 }; cashDelta = -100;
      s = withLog(s, "money", "The registry misplaced a form and fined you. They asked you to fax the replacement. In 2026. They had a fax. It worked.");
      label = "Paperwork fine"; break;
    }
    case "openHouseDisaster": {
      s = { ...s, cash: s.cash - 150, permBonuses: { ...s.permBonuses, hustle: s.permBonuses.hustle + 1 } };
      cashDelta = -150;
      s = withLog(s, "event", "At the open house, " + pick(DISASTER_FLAVORS)
        + ". You cleaned it up, paid for it, and came out slightly harder to rattle.");
      label = "Open house disaster"; break;
    }
    case "fiveStarReview": {
      const capped = deriveStats(s).swagger >= 10;
      s = { ...s, cash: s.cash + 200 };
      if (!capped) s = { ...s, permBonuses: { ...s.permBonuses, swagger: s.permBonuses.swagger + 1 } };
      cashDelta = 200;
      s = withLog(s, "money", "A past client left five stars and a paragraph about your “calming energy.” The brokerage sent a bonus and printed the quote on a wall.");
      label = "Five-star review"; break;
    }
    case "cringeEvent": {
      s = { ...s, cash: s.cash - 100 }; cashDelta = -100;
      if (s.leads.length) {
        const l = pick(s.leads);
        s = { ...s, leads: s.leads.filter((x) => x.id !== l.id),
          counters: { ...s.counters, leadsLost: s.counters.leadsLost + 1 } };
        s = withLog(s, "event", "Your motivational video went viral for the wrong reasons. " + pick(CRINGE_QUOTES)
          + " " + l.clientName + " saw it, watched it twice, and stopped replying. Also, the videographer invoiced you.");
      } else {
        s = withLog(s, "event", "Your motivational video went viral for the wrong reasons. " + pick(CRINGE_QUOTES)
          + " The comments are a crime scene. Also, the videographer invoiced you.");
      }
      label = "Went viral (badly)"; break;
    }
    default: break;
  }
  return { state: s, cashDelta, label };
}

/* ------------------------------------------------------------------- UI */
function Pips({ ap }) {
  return <div className="res-pips" aria-label={ap + " action points left"}>
    {Array.from({ length: AP_PER_WEEK }).map((_, i) =>
      <div key={i} className={"res-pip" + (i < ap ? " on" : "")} />)}
  </div>;
}

function ActionButton({ title, ap, desc, reason, onClick }) {
  return <button className="res-btn" disabled={!!reason} onClick={onClick} title={reason || desc}>
    <div className="t"><span>{title}</span><span className="ap">{ap} AP</span></div>
    <div className="d">{reason || desc}</div>
  </button>;
}

function LeadCard({ lead, state, dispatch }) {
  const a = arch(lead.archetypeId);
  const justSold = !!lead.sold;
  const pct = Math.max(0, (lead.patience / lead.maxPatience) * 100);
  const noAp = state.ap < 1;
  const junior = rankIndex(state.rank) >= rankIndex("junior");
  return <div className="res-lead">
    {justSold && <div className="res-sold">SOLD</div>}
    <div className="n">{lead.clientName}</div>
    <div className="a">{a.label}</div>
    <div className="p">{money(lead.salePrice)}</div>
    <div className="q">{lead.intro}</div>
    <div className="res-fuse"><i className={pct <= 34 ? "low" : ""} style={{ width: pct + "%" }} /></div>
    <div className="a">{lead.patience} week{lead.patience === 1 ? "" : "s"} of goodwill left</div>
    <div className="res-mini">
      {justSold && <div style={{ fontSize: 12, fontStyle: "italic", color: "#6b6f7d" }}>
        Signed, sealed, and already being posted about.</div>}
      {!justSold && lead.stage !== "ready" &&
        <button disabled={noAp || !junior}
          title={!junior ? "Junior Showing Assistant and up only" : noAp ? "No action points left" : ""}
          onClick={() => dispatch({ type: "RUN_SHOWING", leadId: lead.id })}>Run Showing</button>}
      {!justSold && lead.stage === "ready" &&
        <button disabled={noAp || !junior}
          title={!junior ? "Junior Showing Assistant and up only" : noAp ? "No action points left" : ""}
          onClick={() => dispatch({ type: "ATTEMPT_CLOSE", leadId: lead.id })}>
          {state.rank === "junior" ? "Close (Referral Cut)" : "Attempt Close"}</button>}
    </div>
  </div>;
}

function RankTrack({ state }) {
  const cur = rankIndex(state.rank);
  return <div className="res-rank-track">
    {RANKS.map((r, i) => {
      const cls = i === cur ? "cur" : i < cur ? "done" : "";
      const req = i <= cur ? r.blurb :
        [r.req.earnings ? money(r.req.earnings) + " career" : null,
         r.req.showings ? r.req.showings + " showings" : null,
         r.req.deals ? r.req.deals + " deals" : null].filter(Boolean).join(" · ");
      return <div key={r.id} className={"res-rt " + cls}>
        <span className="num">{r.n}</span><span>{r.name}</span><span className="req">{req}</span>
      </div>;
    })}
    {LOCKED_RANKS.map((n, i) =>
      <div key={n} className="res-rt lock" title="Coming in a future update.">
        <span className="num">{5 + i}</span><span>{n}</span><span className="req">Locked</span>
      </div>)}
  </div>;
}

function StatChips({ it }) {
  return <div>
    {it.hustle ? <span className="res-stat">HUS +{it.hustle}</span> : null}
    {it.swagger ? <span className="res-stat">SWA +{it.swagger}</span> : null}
    {it.ego ? <span className="res-stat e">EGO +{it.ego}</span> : null}
    {it.upkeep ? <span className="res-stat">{money(it.upkeep)}/wk</span> : null}
  </div>;
}

function RealEstateSim() {
  const [state, dispatch] = useReducer(reducer, undefined, () => loadSave() || initialState());
  const [tab, setTab] = useState("office");
  const [showSummary, setShowSummary] = useState(false);
  const [confetti, setConfetti] = useState(false);
  const [importText, setImportText] = useState("");
  const [exported, setExported] = useState("");
  const [bump, setBump] = useState(false);
  const prevCash = useRef(state.cash);

  useEffect(() => { writeSave(state); }, [state]);
  useEffect(() => {
    if (state.cash !== prevCash.current) {
      prevCash.current = state.cash; setBump(true);
      const t = setTimeout(() => setBump(false), 460); return () => clearTimeout(t);
    }
  }, [state.cash]);
  useEffect(() => { if (state.summary) setShowSummary(true); }, [state.summary]);
  useEffect(() => {
    if (state.promo) { setConfetti(true); const t = setTimeout(() => setConfetti(false), 2600); return () => clearTimeout(t); }
  }, [state.promo]);

  const st = state.stats;
  const junior = rankIndex(state.rank) >= rankIndex("junior");
  const buyerPlus = rankIndex(state.rank) >= rankIndex("buyerAgent");
  const noAp = state.ap < 1;
  const modDelta = activeModifierDelta(state);
  const bragStrip = useMemo(() => {
    const out = []; for (let i = 0; i < 6; i++) out.push(bragFor(state));
    return out;
  }, [state.week, state.rank]);

  const byStage = { new: [], shown: [], ready: [] };
  state.leads.forEach((l) => byStage[l.stage].push(l));

  const doExport = () => {
    const { summary, promo, ...rest } = state;
    const s = JSON.stringify(rest);
    setExported(s);
    try { navigator.clipboard && navigator.clipboard.writeText(s); } catch (e) {}
  };
  const doImport = () => {
    try {
      const parsed = JSON.parse(importText);
      if (parsed && parsed.version === 1) { dispatch({ type: "IMPORT_SAVE", state: parsed }); setImportText(""); }
      else alert("That doesn't look like a Real Estate Simulator save.");
    } catch (e) { alert("That save wouldn't parse. Check the paste."); }
  };

  if (state.gameOver) {
    return <div><style>{CSS}</style><div className="res-app">
      <div className="res-modal"><div className="res-card">
        <h2 className="res-display">MOVED BACK IN WITH YOUR PARENTS</h2>
        <p style={{ fontSize: 13.5, lineHeight: 1.6 }}>
          Your mother has put the bus bench ad in the garage. Your father keeps calling it
          “the realtor thing.” The gold, such as it was, has been repossessed.
        </p>
        <div className="res-line"><span>Weeks survived</span><b>{state.week}</b></div>
        <div className="res-line"><span>Career earnings</span><b>{money(state.careerEarnings)}</b></div>
        <div className="res-line"><span>Deals closed</span><b>{state.counters.dealsClosed}</b></div>
        <div className="res-line"><span>Showings run</span><b>{state.counters.showingsRun}</b></div>
        <div className="res-line"><span>Clients lost</span><b>{state.counters.leadsLost}</b></div>
        <div className="res-line"><span>Final rank</span><b>{rankOf(state.rank).name}</b></div>
        <button className="res-go" onClick={() => dispatch({ type: "RESTART" })}>Start Over (Humbly)</button>
      </div></div>
    </div></div>;
  }

  return <div>
    <style>{CSS}</style>
    <div className="res-app">
      <header className="res-header">
        <div className="res-hrow">
          <div>
            <div className={"res-cash res-display" + (bump ? " bump" : "")}>{money(state.cash)}</div>
            <div className="res-meta">Week {state.week} · <span className="res-rank">{rankOf(state.rank).name}</span></div>
          </div>
          <Pips ap={state.ap} />
          <div className="res-chips">
            <span className="res-chip">Hustle<b>{st.hustle}</b></span>
            <span className="res-chip">Swagger<b>{st.swagger}</b></span>
            <span className={"res-chip" + (st.ego >= 8 ? " warn" : "")}>Ego<b>{st.ego}</b></span>
          </div>
        </div>
      </header>

      <div className="res-ticker">
        <div className="res-ticker-inner">
          {bragStrip.concat(bragStrip).map((b, i) => <span key={i}>{b}</span>)}
        </div>
      </div>

      {modDelta !== 0 && <div className="res-banner" style={{ marginTop: 10 }}>
        {modDelta > 0
          ? "🔥 HOT MARKET — buyers are making offers on houses they've only seen from the car."
          : "🧊 RATE SPIKE — everybody suddenly wants to “wait and see.”"}
      </div>}
      {rankIndex(state.rank) >= rankIndex("sellerAgent") && state.cash >= 100000 &&
        <div className="res-banner">🏆 Seller's Agent with six figures liquid. <b>To Be Continued in Phase 2.</b> Keep playing.</div>}

      <nav className="res-tabs">
        {[["office", "Office"], ["leads", "Leads"], ["closet", "Closet"], ["log", "Log"]].map(([id, label]) =>
          <button key={id} className={"res-tab" + (tab === id ? " on" : "")} onClick={() => setTab(id)}>
            {label}{id === "leads" && state.leads.length ? " (" + state.leads.length + ")" : ""}
          </button>)}
      </nav>

      {tab === "office" && <>
        <div className="res-panel dark">
          <h3 className="res-h2 res-display">This Week's Work</h3>
          <div className="res-grid">
            <ActionButton title="Work the Phones" ap={1}
              desc={"Dial strangers until leads happen. Hustle " + st.hustle + " means more names."}
              reason={!junior ? "Locked — nobody gives the receptionist a phone list." : noAp ? "No action points left this week." : null}
              onClick={() => dispatch({ type: "WORK_PHONES" })} />
            <ActionButton title="Assist a Showing" ap={1}
              desc="Hold the sign, refill the cookies, learn the trade. Flat $100."
              reason={state.rank !== "receptionist" ? "You're past this. Mostly." : noAp ? "No action points left this week." : null}
              onClick={() => dispatch({ type: "ASSIST_SHOWING" })} />
            <ActionButton title="Side Hustle" ap={1}
              desc="Photos, staging, drone work, aggressive nodding. $150–$400."
              reason={noAp ? "No action points left this week." : null}
              onClick={() => dispatch({ type: "SIDE_HUSTLE" })} />
            <ActionButton title="Run a Showing" ap={1}
              desc={junior ? "Head to the Leads tab and pick a client." : "Locked."}
              reason={!junior ? "Unlocks at Junior Showing Assistant." :
                state.leads.some((l) => l.stage !== "ready") ? "Open the Leads tab to choose a client." : "No lead is waiting on a showing."}
              onClick={() => setTab("leads")} />
            <ActionButton title="Attempt a Close" ap={1}
              desc={buyerPlus ? "Full split. Leads tab." : "Referral cut only until Buyer's Agent."}
              reason={!junior ? "Unlocks at Junior Showing Assistant." :
                byStage.ready.length ? "Open the Leads tab to close." : "Nobody's ready to sign."}
              onClick={() => setTab("leads")} />
          </div>
        </div>
        <div className="res-panel">
          <h3 className="res-h2 res-display">The Ladder</h3>
          <RankTrack state={state} />
          <div style={{ fontSize: 12, color: "#5e6270", marginTop: 10 }}>
            Career earnings {money(state.careerEarnings)} · {state.counters.showingsRun} showings · {state.counters.dealsClosed} deals · weekly overhead {money(weeklyExpenses(state))}
          </div>
        </div>
        <div className="res-panel dark">
          <h3 className="res-h2 res-display">Settings</h3>
          <div className="res-mini" style={{ marginBottom: 8 }}>
            <button onClick={doExport}>Export Save</button>
            <button onClick={doImport} disabled={!importText.trim()}>Import Save</button>
          </div>
          {exported && <textarea className="res-ta" readOnly value={exported}
            onFocus={(e) => e.target.select()} />}
          <textarea className="res-ta" placeholder="Paste a save here, then hit Import Save."
            value={importText} onChange={(e) => setImportText(e.target.value)} />
        </div>
      </>}

      {tab === "leads" && <div className="res-panel dark">
        <h3 className="res-h2 res-display">Pipeline</h3>
        {!state.leads.length && <div style={{ fontSize: 13, color: "var(--muted)" }}>
          Nobody's in the pipeline. The phone is right there, and it is not going to ring on its own.
        </div>}
        <div className="res-cols">
          {[["new", "New"], ["shown", "Shown"], ["ready", "Ready to Close"]].map(([k, label]) =>
            <div className="res-col" key={k}>
              <h3>{label} ({byStage[k].length})</h3>
              {byStage[k].map((l) => <LeadCard key={l.id} lead={l} state={state} dispatch={dispatch} />)}
            </div>)}
        </div>
      </div>}

      {tab === "closet" && <div className="res-panel dark">
        <h3 className="res-h2 res-display">The Closet</h3>
        {SLOTS.map((slot) => <div key={slot.id} style={{ marginBottom: 16 }}>
          <div className="res-meta" style={{ marginBottom: 6 }}>{slot.label}</div>
          <div className="res-grid">
            {SWAG.filter((i) => i.slot === slot.id).map((it) => {
              const owned = state.ownedSwagIds.includes(it.id);
              const eq = state.equipped[slot.id] === it.id;
              const locked = rankIndex(state.rank) < rankIndex(it.unlockRank);
              const afford = state.cash >= it.price;
              return <div key={it.id} className={"res-item" + (eq ? " eq" : "") + (locked ? " lock" : "")}>
                <div className="nm">{it.name}</div>
                <div className="res-price">{money(it.price)}</div>
                <StatChips it={it} />
                <div className="fl">{it.flavor}</div>
                {locked
                  ? <div className="res-meta">Unlocks at {rankOf(it.unlockRank).name}</div>
                  : owned
                    ? <div className="res-mini"><button onClick={() => dispatch({ type: "EQUIP_SWAG", itemId: it.id })}>
                        {eq ? "Equipped — Take Off" : "Equip"}</button></div>
                    : <div className="res-mini"><button disabled={!afford}
                        title={afford ? "" : "You cannot afford this. Yet."}
                        onClick={() => dispatch({ type: "BUY_SWAG", itemId: it.id })}>Buy</button></div>}
              </div>;
            })}
          </div>
        </div>)}
      </div>}

      {tab === "log" && <div className="res-panel">
        <h3 className="res-h2 res-display">The Record</h3>
        <ul className="res-log">
          {state.log.map((e, i) => <li key={i}>
            <span className="w">Wk {e.week}</span><span className={e.kind}>{e.text}</span>
          </li>)}
        </ul>
      </div>}

      <button className="res-end res-display" onClick={() => dispatch({ type: "END_WEEK" })}>
        END WEEK {state.week}
      </button>

      {showSummary && state.summary && <div className="res-modal" onClick={() => setShowSummary(false)}>
        <div className="res-card" onClick={(e) => e.stopPropagation()}>
          <h2 className="res-display">WEEK {state.summary.week} — IN REVIEW</h2>
          <div className="res-meta" style={{ marginBottom: 10 }}>{rankOf(state.rank).name}</div>
          {state.summary.promo && <div className="res-banner" style={{ color: "#14161f", background: "#f0e2ad", borderColor: "#c9a227" }}>
            🎉 PROMOTED TO {state.summary.promo.toUpperCase()} — certificate suitable for framing.
          </div>}
          {state.summary.moneyIn.map(([l, v], i) => <div className="res-line" key={"i" + i}>
            <span>{l}</span><b style={{ color: "var(--mint)" }}>+{money(v)}</b></div>)}
          {state.summary.moneyOut.map(([l, v], i) => <div className="res-line" key={"o" + i}>
            <span>{l}</span><b style={{ color: "var(--sold)" }}>-{money(v)}</b></div>)}
          <div className="res-line"><span><b>Net for the week</b></span>
            <b style={{ color: state.summary.net >= 0 ? "var(--mint)" : "var(--sold)" }}>
              {state.summary.net >= 0 ? "+" : ""}{money(state.summary.net)}</b></div>
          <div className="res-line"><span>On hand</span><b>{money(state.cash)}</b></div>
          {!!state.summary.events.length && <div style={{ fontSize: 12.5, marginTop: 10, color: "#5e6270" }}>
            This week's incidents: {state.summary.events.join(", ")}. Details in the Log.
          </div>}
          <div className="res-brag"><b style={{ color: "var(--brass)" }}>Your post:</b><br />{state.summary.brag}</div>
          <button className="res-go" onClick={() => setShowSummary(false)}>Back to the Grind</button>
        </div>
      </div>}

      {confetti && <div className="res-confetti">
        {Array.from({ length: 60 }).map((_, i) =>
          <i key={i} style={{ left: (i * 1.7) % 100 + "%", animationDelay: (i % 12) * 0.09 + "s",
            background: i % 3 === 0 ? "#f5f2ea" : "#c9a227" }} />)}
      </div>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<RealEstateSim />);
</script>
</body>
</html>
